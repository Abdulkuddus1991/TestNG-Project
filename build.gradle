plugins {
    id 'java'
}

group = 'org.example'
version = '1.0-SNAPSHOT'

repositories {
    mavenCentral()
}

dependencies {
    testImplementation("org.testng:testng:7.12.0")
    implementation("org.seleniumhq.selenium:selenium-java:4.45.0")
    implementation("org.seleniumhq.selenium:selenium-chrome-driver:4.45.0")
    implementation("org.slf4j:slf4j-simple:2.0.18")
    implementation("org.slf4j:slf4j-api:2.0.18")
    implementation("commons-io:commons-io:2.21.0")
    implementation("com.github.javafaker:javafaker:1.0.2")
    implementation("com.googlecode.json-simple:json-simple:1.1.1")
    implementation("io.qameta.allure:allure-testng:2.30.0")
    implementation("com.aventstack:extentreports:5.1.0")
}


test {
    useTestNG() {
        if (project.hasProperty("suitename")) {
            systemProperty "suitename", project.property("suitename")
        }
        suites "src/test/resources/EmployeeRegression.xml"
    }

    // Prevent Gradle from finding and running extra tests
    scanForTestClasses = false

    // Fix the "unreadable input" error
    doNotTrackState("TestNG suite only")

    testLogging {
        events "PASSED", "FAILED", "SKIPPED", "STANDARD_OUT"
        showStandardStreams = true


    }
}